            <div>
                <h1 class="text-2xl font-bold">لوحة تحكم المدير - صلاحيات الأعضاء</h1>
                <p class="text-slate-300 mt-1 text-sm">إدارة الحسابات والصلاحيات والجهات المرتبطة بسرعة ومن مكان واحد</p>
            </div>
            <div class="flex gap-2"><a href="admin_audit.html" class="bg-indigo-500/80 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-bold">🛡️ سجل التدقيق</a><a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-sm font-bold">العودة للمنظومة</a></div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

              <div class="text-xs font-bold text-slate-600">عدد المستخدمين: <span id="usersCount">0</span></div>

            </div>
            <div class="mw-table-shell">
            <table class="w-full text-right min-w-[920px]">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="p-4 text-sm text-slate-600">الاسم والوظيفة</th>
                        <th class="p-4 text-sm text-slate-600">التواصل</th>
                        <th class="p-4 text-sm text-slate-600">الصلاحية الحالية</th>
                        <th class="p-4 text-sm text-slate-600">الجهة المرتبطة</th>
                        <th class="p-4 text-sm text-slate-600">تغيير الصلاحية</th>
                    </tr>
                </thead>
                <tbody id="usersTable" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="p-8 text-center text-slate-500">جاري تحميل المستخدمين...</td></tr>
                </tbody>
            </table>
            </div>
