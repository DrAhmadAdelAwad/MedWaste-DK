<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
    <script src="app-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-gradient-to-r from-amber-600 to-orange-500 text-white p-6 text-center">
            <h1 class="text-xl font-bold">نسيت كلمة المرور؟</h1>
            <p class="text-amber-100 mt-1 text-xs">أدخل بريدك الإلكتروني المسجل وسنرسل لك كلمة المرور الخاصة بك.</p>
        </div>
        <form id="resetForm" class="p-8 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-left" dir="ltr">
            </div>
            <div id="statusMsg" class="hidden text-center text-xs font-bold p-2 rounded-xl"></div>
            <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                إرسال كلمة المرور
            </button>
            <div class="text-center text-xs font-semibold mt-4">
                <a href="login.html" class="text-slate-600 hover:underline">العودة لتسجيل الدخول</a>
            </div>
        </form>
    </div>
    <script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            btn.innerText = 'جاري الإرسال...';
            btn.disabled = true;

            try {
                const result = await apiPost('forgot_password', {
                    email: document.getElementById('email').value
                });
                
                msg.classList.remove('hidden', 'text-rose-700', 'bg-rose-50', 'text-emerald-700', 'bg-emerald-50');
                if (result.result === 'success') {
                    msg.innerText = 'تم إرسال كلمة مرور مؤقتة جديدة إلى بريدك الإلكتروني بنجاح.';
                    msg.classList.add('text-emerald-700', 'bg-emerald-50');
                } else {
                    msg.innerText = result.message;
                    msg.classList.add('text-rose-700', 'bg-rose-50');
                }
            } catch (err) {
                msg.innerText = err.message || 'خطأ في الاتصال.';
                msg.classList.add('text-rose-700', 'bg-rose-50');
            }
            btn.innerText = 'إرسال كلمة المرور';
            btn.disabled = false;
        });
    </script>
</body>
</html>
