    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظومة النفايات الطبية</title>
    <link rel="stylesheet" href="assets/css/tailwind.generated.css?v=8.5.3">
    <link rel="stylesheet" href="assets/css/base.css?v=8.5.3">

<body class="auth-page bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-gradient-to-r from-red-950 to-rose-800 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">تسجيل الدخول</h1>
            <p class="text-red-100 mt-1 text-sm">منظومة النفايات الطبية الخطرة بالدقهلية</p>
        </div>
        
        <form id="loginForm" class="p-8 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-left" dir="ltr">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-left" dir="ltr">
            </div>
            
            <div id="statusMsg" class="hidden text-center text-sm font-bold p-2 rounded-xl text-rose-700 bg-rose-50 border border-rose-200"></div>
            
            <button type="submit" id="submitBtn" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                دخول
            </button>
            
            <div class="flex justify-between items-center text-xs font-semibold mt-4">
                <a href="forgot_password.html" class="text-red-700 hover:underline">نسيت كلمة المرور؟</a>
                <a href="register.html" class="text-slate-600 hover:underline">تسجيل مستخدم جديد</a>
            </div>
        </form>
    </div>
