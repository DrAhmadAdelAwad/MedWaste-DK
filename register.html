<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مستخدم - منظومة النفايات الطبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 py-8">

    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">حساب مستخدم جديد</h1>
            <p class="text-emerald-100 mt-1 text-sm">التسجيل بصلاحية مدخل بيانات (يتطلب ترقية من المدير للوصول الكامل)</p>
        </div>
        
        <form id="registerForm" class="p-8 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">الاسم كاملاً *</label>
                    <input type="text" id="fullName" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">الوظيفة *</label>
                    <input type="text" id="jobTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">جهة العمل *</label>
                    <input type="text" id="workplace" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">رقم الموبايل *</label>
                    <input type="tel" id="mobile" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-left" dir="ltr">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">البريد الإلكتروني *</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-left" dir="ltr">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">كلمة المرور *</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">إعادة كلمة المرور *</label>
                    <input type="password" id="confirmPassword" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-left" dir="ltr">
                </div>
            </div>
            
            <div id="statusMsg" class="hidden text-center text-sm font-bold p-2 rounded-xl text-rose-700 bg-rose-50 border border-rose-200"></div>
            
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition mt-4">
                تأكيد وإنشاء الحساب
            </button>
            
            <div class="text-center text-xs font-semibold mt-4">
                <a href="login.html" class="text-teal-700 hover:underline">لديك حساب بالفعل؟ تسجيل الدخول</a>
            </div>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwSGLsP2eWUhnaFwwL8pgSYsa4ox7eKNOI6DwtVBAY_5mcYxzotok5jc4LhUi1TPGnm/exec';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            
            if (pass !== confirmPass) {
                msg.innerText = 'كلمتا المرور غير متطابقتين';
                msg.classList.remove('hidden');
                return;
            }

            btn.innerText = 'جاري تسجيل البيانات...';
            btn.disabled = true;

            let formData = new FormData();
            formData.append('action', 'register');
            formData.append('fullName', document.getElementById('fullName').value);
            formData.append('jobTitle', document.getElementById('jobTitle').value);
            formData.append('workplace', document.getElementById('workplace').value);
            formData.append('mobile', document.getElementById('mobile').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('password', pass);

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.json();
                
                if (result.result === 'success') {
                    alert('تم التسجيل بنجاح! يمكنك الآن تسجيل الدخول.');
                    window.location.href = 'login.html';
                } else {
                    msg.innerText = result.message;
                    msg.classList.remove('hidden');
                    btn.innerText = 'تأكيد وإنشاء الحساب';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.innerText = 'خطأ في الاتصال بالخادم';
                msg.classList.remove('hidden');
                btn.innerText = 'تأكيد وإنشاء الحساب';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
